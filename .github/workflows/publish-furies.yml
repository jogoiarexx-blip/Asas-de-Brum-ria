name: Publicar Furias GLB (modelos e versoes mobile)

on:
  push:
    branches: [main]
    paths:
      - assets/models/furia-da-noite.glb
      - assets/models/furia-da-luz.glb
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fury-assets-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Pillow para textura JPEG 1K
        run: python -m pip install 'Pillow>=11,<13'
      - name: Validar modelos principais e gerar versoes mobile
        run: |
          test -f assets/models/furia-da-noite.glb
          test -f assets/models/furia-da-luz.glb
          python tools/prepare_fury_models.py \
            --night assets/models/furia-da-noite.glb \
            --light assets/models/furia-da-luz.glb \
            --out assets/models --texture-size 1024
          npm run check
      - name: Registrar os modelos mobile e ativar a publicacao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/furia-da-noite-mobile.glb \
            assets/models/furia-da-luz-mobile.glb \
            assets/models/dragon-species.json \
            assets/models/asset-qa.json
          if git diff --cached --quiet; then
            echo 'GLBs ja publicados; nenhuma mudanca.'
          else
            git commit -m 'Assets: ativar duas Furias e variantes moveis validadas'
            git push origin HEAD:main
          fi
